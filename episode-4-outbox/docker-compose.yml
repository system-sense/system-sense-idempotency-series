services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sysense
      POSTGRES_PASSWORD: sysense
      POSTGRES_DB: sysense
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysense -d sysense"]
      interval: 2s
      timeout: 3s
      retries: 60

  # ─────────────────────────────────────────────────────────────────────────
  #  EPISODE 3'S NEW SERVICE, and the only one added since Episode 1.
  #
  #  Redis Streams consumer groups, because they have genuine visibility-timeout
  #  semantics rather than an imitation of them: XREADGROUP puts an entry in a
  #  consumer's pending list, XACK takes it out, and XAUTOCLAIM hands anything
  #  idle too long to somebody else. That is SQS's visibility timeout and
  #  Kafka's max.poll.interval.ms, in a container that starts in a second and
  #  needs nothing explained about brokers or partitions first.
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ─────────────────────────────────────────────────────────────────────────
  #  EPISODE 1'S KNOB, unchanged.
  #
  #  How slow the payment processor is. Latency for a given customer is
  #
  #      LATENCY_BASE_MS + (customer_id * 137) % LATENCY_SPREAD_MS
  #
  #  which with the defaults spans 1200–3599 ms and straddles the two-second
  #  timeout the client uses. Roughly half the checkouts come back in time and
  #  roughly half do not.
  #
  #  Turn the processor reliably fast and the bug vanishes:
  #
  #      LATENCY_BASE_MS=100 LATENCY_SPREAD_MS=200 docker compose up
  #
  #  It has not been fixed. It has been hidden, which is how this reaches
  #  production in the first place.
  # ─────────────────────────────────────────────────────────────────────────
  processor:
    build: ./processor
    environment:
      DATABASE_URL: "postgres://sysense:sysense@postgres:5432/sysense"
      LATENCY_BASE_MS: "${LATENCY_BASE_MS:-1200}"
      LATENCY_SPREAD_MS: "${LATENCY_SPREAD_MS:-2400}"
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  #  EPISODE 2'S SERVICE, AND IT IS NOT THE KNOB ANY MORE.
  #
  #  Pinned to `claim`: the key is inserted before the work, ON CONFLICT DO
  #  NOTHING, and the loser of the race replays the stored response. That
  #  endpoint cannot be made to charge twice for one key, and nothing in this
  #  episode changes a line of it.
  #
  #  It is pinned rather than left configurable on purpose. Episode 3 is not
  #  about whether the endpoint is correct. It is about what happens in front of
  #  a correct endpoint, and leaving a way to break the endpoint would let a
  #  viewer conclude the queue was fine all along.
  # ─────────────────────────────────────────────────────────────────────────
  app:
    build: .
    environment:
      DATABASE_URL: "postgres://sysense:sysense@postgres:5432/sysense"
      PROCESSOR_URL: "http://processor:9000"
      PROCESSOR_TIMEOUT_SECONDS: "30"
      IDEMPOTENCY_MODE: "claim"
      IDEMPOTENCY_TTL_SECONDS: "${IDEMPOTENCY_TTL_SECONDS:-86400}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      processor:
        condition: service_started

  # ─────────────────────────────────────────────────────────────────────────
  #  EPISODE 3'S KNOBS. All of them are on the consumer, and every one of them
  #  is a line in a config file somebody set once and never looked at again.
  #
  #    ACK_MODE=after|before   where the XACK goes. This one line is the choice
  #                            between at-least-once and at-most-once, and your
  #                            queue library picked it for you.
  #    VISIBILITY_TIMEOUT_MS   how long an entry may sit idle before another
  #                            consumer may take it. A guess about how long the
  #                            work takes, made before the work existed.
  #    HEARTBEAT=1             hold the lease while working, so it cannot expire
  #                            underneath a job that is still running.
  #    MAX_DELIVERIES=N        dead-letter after N deliveries. 0 means forever.
  #    IDEMPOTENT_CONSUMER=1   pass the producer's key to Episode 2's endpoint.
  #    WORKER_BATCH=N          how many entries to take per read.
  #
  #  EPISODE 4 CHANGES ONLY THE DEFAULTS, and it changes them to Episode 3's
  #  answers: the lease is held, there is a delivery limit, and the producer's
  #  key is passed on. This consumer is finished. It cannot be made to charge
  #  twice for one key however many times the queue hands it the same job.
  #
  #  Everything this episode loses, it loses in front of it.
  #
  #  Two workers rather than `deploy: replicas: 2` so that one of them can be
  #  killed by name on camera:  docker compose kill worker-1
  # ─────────────────────────────────────────────────────────────────────────
  worker-1: &worker
    build: ./worker
    environment:
      REDIS_URL: "redis://redis:6379/0"
      APP_URL: "http://app:8000"
      DATABASE_URL: "postgres://sysense:sysense@postgres:5432/sysense"
      WORKER_NAME: "worker-1"
      ACK_MODE: "${ACK_MODE:-after}"
      VISIBILITY_TIMEOUT_MS: "${VISIBILITY_TIMEOUT_MS:-15000}"
      HEARTBEAT: "${HEARTBEAT:-1}"
      MAX_DELIVERIES: "${MAX_DELIVERIES:-5}"
      IDEMPOTENT_CONSUMER: "${IDEMPOTENT_CONSUMER:-1}"
      WORKER_BATCH: "${WORKER_BATCH:-1}"
      HTTP_TIMEOUT_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  worker-2:
    <<: *worker
    environment:
      REDIS_URL: "redis://redis:6379/0"
      APP_URL: "http://app:8000"
      DATABASE_URL: "postgres://sysense:sysense@postgres:5432/sysense"
      WORKER_NAME: "worker-2"
      ACK_MODE: "${ACK_MODE:-after}"
      VISIBILITY_TIMEOUT_MS: "${VISIBILITY_TIMEOUT_MS:-15000}"
      HEARTBEAT: "${HEARTBEAT:-1}"
      MAX_DELIVERIES: "${MAX_DELIVERIES:-5}"
      IDEMPOTENT_CONSUMER: "${IDEMPOTENT_CONSUMER:-1}"
      WORKER_BATCH: "${WORKER_BATCH:-1}"
      HTTP_TIMEOUT_SECONDS: "30"

  # ─────────────────────────────────────────────────────────────────────────
  #  EPISODE 4'S FIRST NEW SERVICE, and the one with the bug in it.
  #
  #  Episode 3's producer was `scripts/enqueue.py`: one XADD and an exit. It had
  #  no database, so it could not have this bug. This one has a database, and an
  #  order has to become true in two places at once.
  #
  #    PUBLISH_MODE=commit_first   the row, then the event. Loses events.
  #    PUBLISH_MODE=publish_first  the event, then the row. Loses orders, which
  #                                is worse: money moves for something that is
  #                                not in the database.
  #    PUBLISH_MODE=outbox         both, in one transaction, to one database.
  #
  #    CRASH_EVERY=N               kill the process on every Nth order, inside
  #                                the window. A real os._exit(1): no unwinding,
  #                                no shutdown hook. Docker restarts it, because
  #                                that is also what happens.
  #
  #  Watch it lose three orders' worth of money:
  #
  #      PUBLISH_MODE=commit_first CRASH_EVERY=4 docker compose up --build
  #      python3 scripts/place-orders.py --customers $(seq 1 12)
  #      python3 scripts/reconcile.py
  #
  #  `restart: unless-stopped` is not scaffolding for the demo. It is the
  #  reason the bug is invisible in production: the process comes back in two
  #  seconds, the dashboard shows a blip, and the event is still gone.
  # ─────────────────────────────────────────────────────────────────────────
  orders:
    build: ./producer
    environment:
      DATABASE_URL: "postgres://sysense:sysense@postgres:5432/sysense"
      REDIS_URL: "redis://redis:6379/0"
      PUBLISH_MODE: "${PUBLISH_MODE:-outbox}"
      CRASH_EVERY: "${CRASH_EVERY:-0}"
    ports:
      - "8100:8100"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  #  EPISODE 4'S SECOND NEW SERVICE, and the one that makes the pattern work.
  #
  #  Reads the outbox, publishes, marks the row sent. Its own two writes are
  #  once again two systems — it has the producer's bug and cannot not have it —
  #  but here the bug costs a DUPLICATE rather than a LOSS, and duplicates are
  #  what Episodes 2 and 3 were about.
  #
  #    POLL_MS               the latency the outbox costs you. The honest price.
  #    CRASH_AFTER_PUBLISH=N kill it after the XADD and before the row is marked
  #                          sent, until N rows have gone out twice.
  #
  #  Show the whole argument closing on itself:
  #
  #      PUBLISH_MODE=outbox CRASH_AFTER_PUBLISH=3 IDEMPOTENT_CONSUMER=0 \
  #        docker compose up --build          # three duplicate publishes, $120 over
  #      IDEMPOTENT_CONSUMER=1 ...            # three duplicate publishes, $0 over
  # ─────────────────────────────────────────────────────────────────────────
  relay:
    build: ./relay
    environment:
      DATABASE_URL: "postgres://sysense:sysense@postgres:5432/sysense"
      REDIS_URL: "redis://redis:6379/0"
      RELAY_NAME: "relay"
      POLL_MS: "${POLL_MS:-200}"
      RELAY_BATCH: "${RELAY_BATCH:-10}"
      CRASH_AFTER_PUBLISH: "${CRASH_AFTER_PUBLISH:-0}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
